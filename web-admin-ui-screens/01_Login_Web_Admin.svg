<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" width="1440" height="1024" style="background:#F6F8FB; font-family:'Inter', 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;">
  <!-- Background -->
  <rect width="1440" height="1024" fill="#F6F8FB"/>
  
  <!-- Left Enterprise Banner -->
  <rect width="720" height="1024" fill="#FF7A00"/>
  <circle cx="100" cy="120" r="220" fill="#FFA040" opacity="0.35"/>
  <circle cx="620" cy="880" r="280" fill="#E65100" opacity="0.4"/>
  
  <text x="80" y="300" font-size="34" font-weight="bold" fill="#FFFFFF">VMO ENTERPRISE ERP</text>
  <text x="80" y="340" font-size="16" font-weight="bold" fill="#FFE0B2">HỆ THỐNG QUẢN TRỊ NGUỒN LỰC DOANH NGHIỆP TẬP TRUNG</text>
  <text x="80" y="390" font-size="14" fill="#FFFFFF">Nền tảng vận hành hợp nhất: Quản lý 921+ nhân sự, Cơ cấu 81 đơn vị,</text>
  <text x="80" y="415" font-size="14" fill="#FFFFFF">Bảng chấm công Biometric IoT 31 ngày, Lịch OT, Hợp đồng &amp; Quỹ phép năm.</text>
  
  <rect x="80" y="465" width="220" height="32" rx="16" fill="#673AB7" opacity="0.95"/>
  <text x="190" y="486" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">CHỨNG CHỈ ISO/IEC 27001</text>
  
  <rect x="315" y="465" width="290" height="32" rx="16" fill="#1976D2" opacity="0.95"/>
  <text x="460" y="486" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">BẢO MẬT ARGON2ID &amp; PHIÊN HTTPONLY</text>
  
  <text x="80" y="960" font-size="12" fill="#FFE0B2">VMO ERP Platform v2.0 Enterprise • Bản quyền 2026 VMO Group</text>

  <!-- Right Login Card -->
  <rect x="820" y="140" width="520" height="740" rx="16" fill="#FFFFFF" stroke="#E5E9EF" stroke-width="1"/>
  
  <rect x="860" y="180" width="160" height="26" rx="13" fill="#FFF2E8"/>
  <text x="940" y="198" font-size="11" font-weight="bold" fill="#FF7A00" text-anchor="middle">CỔNG QUẢN TRỊ VIÊN</text>
  
  <text x="860" y="240" font-size="28" font-weight="bold" fill="#1E293B">Đăng nhập Quản trị</text>
  <text x="860" y="270" font-size="13" fill="#6F7E95">Sử dụng tài khoản doanh nghiệp được cấp thẩm quyền quản trị viên.</text>

  <!-- Input Email -->
  <text x="860" y="320" font-size="12" font-weight="bold" fill="#1E293B">Email doanh nghiệp hoặc Mã nhân viên [*]</text>
  <rect x="860" y="335" width="440" height="48" rx="8" fill="#F6F8FB" stroke="#E5E9EF"/>
  <text x="880" y="365" font-size="14" fill="#1E293B">admin@vmo-group.com</text>

  <!-- Input Password -->
  <text x="860" y="415" font-size="12" font-weight="bold" fill="#1E293B">Mật khẩu quản trị [*]</text>
  <rect x="860" y="430" width="440" height="48" rx="8" fill="#F6F8FB" stroke="#E5E9EF"/>
  <text x="880" y="460" font-size="14" fill="#1E293B">••••••••••••••••</text>
  <text x="1270" y="460" font-size="14" fill="#6F7E95">👁️</text>

  <!-- Remember & Forgot -->
  <rect x="860" y="500" width="18" height="18" rx="4" fill="#FF7A00"/>
  <text x="869" y="514" font-size="12" font-weight="bold" fill="#FFF" text-anchor="middle">✓</text>
  <text x="888" y="514" font-size="13" fill="#1E293B">Ghi nhớ đăng nhập (30 ngày)</text>
  <text x="1300" y="514" font-size="13" font-weight="bold" fill="#FF7A00" text-anchor="end">Quên mật khẩu?</text>

  <!-- Login Button -->
  <rect x="860" y="540" width="440" height="50" rx="8" fill="#FF7A00"/>
  <text x="1080" y="571" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ĐĂNG NHẬP VÀO HỆ THỐNG</text>

  <!-- Divider -->
  <line x1="860" y1="620" x2="1040" y2="620" stroke="#E5E9EF"/>
  <text x="1080" y="625" font-size="11" font-weight="bold" fill="#8C9BAE" text-anchor="middle">HOẶC</text>
  <line x1="1120" y1="620" x2="1300" y2="620" stroke="#E5E9EF"/>

  <!-- Google SSO Button -->
  <rect x="860" y="645" width="440" height="48" rx="8" fill="#FFFFFF" stroke="#E5E9EF"/>
  <text x="1080" y="675" font-size="13" font-weight="bold" fill="#1E293B" text-anchor="middle">G  Đăng nhập bằng Google Workspace (@vmo-group.com)</text>

  <!-- 2FA & Security Notice -->
  <rect x="860" y="720" width="440" height="50" rx="8" fill="#F6F8FB" stroke="#E5E9EF"/>
  <text x="880" y="745" font-size="12" fill="#6F7E95">🛡️ Bảo mật: Cloudflare Turnstile &amp; Xác thực 2 bước TOTP</text>
  <text x="880" y="762" font-size="11" fill="#8C9BAE">Chống Brute-force: Khóa tạm sau 5 lần nhập sai liên tiếp</text>

</svg>